<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escaneo QR Dinámico</title>
  <!-- Google Analytics / Tag Manager (Opcional: Reemplaza G-XXXXXXXXXX por tu ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    img, video {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="card" id="contenedor">
    <h1>Procesando escaneo...</h1>
  </div>

  <script>
    // --- 1. CONFIGURACIÓN DE REGLAS ---
    const FECHA_CAMBIO = new Date('2026-08-07T00:00:00');

    const RECURSOS = {
      foto: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80',
      video: 'https://www.w3schools.com/html/mov_bbb.mp4'
    };

    // --- 2. DETECCIÓN DE DISPOSITIVO ---
    function obtenerDispositivo() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(ua)) return 'Android';
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'iOS';
      return 'Desktop / Otro';
    }

    // --- 3. REGISTRO DE ESTADÍSTICAS ---
    function registrarEscaneo(dispositivo, tipoContenido) {
      const evento = {
        fecha: new Date().toISOString(),
        dispositivo: dispositivo,
        contenidoMostrado: tipoContenido
      };

      // A) Google Analytics Event (si configuraste tu ID)
      if (typeof gtag === 'function') {
        gtag('event', 'qr_scan', {
          'device_type': dispositivo,
          'content_type': tipoContenido
        });
      }

      // B) Almacenamiento Local (para pruebas y vista previa en stats.html)
      let historial = JSON.parse(localStorage.getItem('qr_stats') || '[]');
      historial.push(evento);
      localStorage.setItem('qr_stats', JSON.stringify(historial));
    }

    // --- 4. EJECUCIÓN Y RENDERIZADO ---
    const dispositivo = obtenerDispositivo();
    const ahora = new Date();
    const contenedor = document.getElementById('contenedor');

    if (ahora < FECHA_CAMBIO) {
      // HOY: Mostrar Foto + Personalización por dispositivo
      registrarEscaneo(dispositivo, 'Foto');
      
      contenedor.innerHTML = `
        <span class="badge">Detectado: ${dispositivo}</span>
        <h1>Promoción Exclusiva</h1>
        <p>Bienvenido usuario de ${dispositivo}</p>
        <img src="${RECURSOS.foto}" alt="Foto promocional">
      `;
    } else {
      // MAÑANA: Mostrar Video
      registrarEscaneo(dispositivo, 'Video');

      contenedor.innerHTML = `
        <span class="badge">Detectado: ${dispositivo}</span>
        <h1>Lanzamiento Oficial</h1>
        <p>Contenido en video para ${dispositivo}</p>
        <video controls autoplay loop muted playsinline>
          <source src="${RECURSOS.video}" type="video/mp4">
        </video>
      `;
    }
  </script>
</body>
</html>
